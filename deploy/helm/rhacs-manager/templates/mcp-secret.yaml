{{- if and (eq (default "hub" .Values.mode) "hub") .Values.mcp.enabled .Values.mcp.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.mcp.secret.name }}
  namespace: {{ include "rhacs-manager.namespace" . }}
  labels:
    {{- include "rhacs-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_API_KEY: {{ required "mcp.secret.stringData.MCP_API_KEY is required when mcp.enabled and mcp.secret.create are true (must match a backend SPOKE_API_KEYS entry)" .Values.mcp.secret.stringData.MCP_API_KEY | quote }}
{{- end }}
