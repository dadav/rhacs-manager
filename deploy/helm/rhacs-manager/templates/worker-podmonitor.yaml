{{- if and (eq (default "hub" .Values.mode) "hub") .Values.backend.enabled .Values.worker.enabled .Values.backend.monitoring.enabled }}
# The worker is the only process that runs the scheduler, so the scheduler job
# metrics exist only on its /metrics endpoint. It has no Service (nothing calls
# it), hence a PodMonitor. Scrape settings are shared with the backend ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.worker.deploymentName }}
  namespace: {{ include "rhacs-manager.namespace" . }}
  labels:
    {{- include "rhacs-manager.labels" . | nindent 4 }}
    {{- with .Values.backend.monitoring.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.worker.deploymentName }}
  {{- with .Values.backend.monitoring.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  podMetricsEndpoints:
    - port: http
      path: {{ .Values.backend.monitoring.serviceMonitor.path }}
      interval: {{ .Values.backend.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.backend.monitoring.serviceMonitor.scrapeTimeout }}
      scheme: http
{{- end }}
