{{- if eq (default "hub" .Values.mode) "spoke" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.spoke.authHeaderInjector.clusterRoleName }}
  labels:
    {{- include "rhacs-manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  # Identity extra.email is the user's real address (oauth-proxy only knows <user>@cluster.local).
  - apiGroups: ["user.openshift.io"]
    resources: ["identities"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.spoke.authHeaderInjector.clusterRoleBindingName }}
  labels:
    {{- include "rhacs-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.spoke.authHeaderInjector.clusterRoleName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.spoke.oauthProxy.serviceAccountName }}
    namespace: {{ include "rhacs-manager.namespace" . }}
{{- end }}
